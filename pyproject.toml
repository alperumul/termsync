[project]
name = "termsync"
version = "0.1.0"
description = "Save and restore Claude Code and Codex sessions in Windows Terminal"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
extend-select = ["E501"]
